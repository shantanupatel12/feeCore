# Railway Nixpacks build configuration for FeeCore backend
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --workspace=packages/shared-types --workspace=backend --include-workspace-root"]

[phases.build]
cmds = [
  "npm run build --workspace=packages/shared-types",
  "npm run prisma:generate",
  "npm run build --workspace=@feecore/api"
]

[start]
cmd = "npm run prisma:migrate:deploy && node backend/dist/main/main.js"
